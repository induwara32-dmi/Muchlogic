<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" fill="none">
  <!-- Mobile Apps: two phones — an app home screen and a detail screen. Colours = site tokens. -->
  <defs>
    <filter id="sh" x="-20%" y="-8%" width="140%" height="122%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0b1b2e" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1b2e" flood-opacity=".1"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1ea"/><stop offset="1" stop-color="#fb923c" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1000" fill="#f4f6f9"/>
  <circle cx="600" cy="500" r="380" fill="#fdf1ea"/>
  <circle cx="600" cy="500" r="250" fill="#fff" opacity=".6"/>

  <!-- Phone A: home -->
  <g filter="url(#sh)"><rect x="236" y="150" width="340" height="700" rx="52" fill="#0b1b2e"/></g>
  <rect x="252" y="166" width="308" height="668" rx="40" fill="#fff"/>
  <rect x="362" y="180" width="88" height="22" rx="11" fill="#0b1b2e"/>
  <rect x="280" y="232" width="90" height="10" rx="5" fill="#a9b7c8"/>
  <rect x="280" y="254" width="170" height="20" rx="8" fill="#0b1b2e"/>
  <circle cx="520" cy="252" r="20" fill="#fdf1ea"/>
  <!-- feature card -->
  <rect x="280" y="298" width="252" height="150" rx="20" fill="url(#card)"/>
  <rect x="302" y="324" width="120" height="14" rx="7" fill="#fff"/>
  <rect x="302" y="350" width="160" height="10" rx="5" fill="#fff" opacity=".7"/>
  <rect x="302" y="400" width="88" height="28" rx="14" fill="#fff"/>
  <circle cx="490" cy="400" r="34" fill="#fff" opacity=".18"/>
  <!-- icon grid -->
  <g>
    <rect x="280" y="474" width="56" height="56" rx="16" fill="#fdf1ea"/><circle cx="308" cy="502" r="10" fill="#c2410c"/>
    <rect x="345" y="474" width="56" height="56" rx="16" fill="#f4f6f9"/><rect x="363" y="492" width="20" height="20" rx="5" fill="#a9b7c8"/>
    <rect x="410" y="474" width="56" height="56" rx="16" fill="#f4f6f9"/><path d="M428 512l10-18 10 18z" fill="#a9b7c8"/>
    <rect x="476" y="474" width="56" height="56" rx="16" fill="#fdf1ea"/><rect x="494" y="492" width="20" height="20" rx="10" fill="#fb923c"/>
  </g>
  <!-- list -->
  <rect x="280" y="556" width="252" height="66" rx="16" fill="#f4f6f9"/>
  <rect x="294" y="570" width="38" height="38" rx="10" fill="#fff"/><rect x="346" y="574" width="110" height="10" rx="5" fill="#445063"/><rect x="346" y="592" width="76" height="8" rx="4" fill="#a9b7c8"/>
  <rect x="280" y="634" width="252" height="66" rx="16" fill="#f4f6f9"/>
  <rect x="294" y="648" width="38" height="38" rx="10" fill="#fff"/><rect x="346" y="652" width="96" height="10" rx="5" fill="#445063"/><rect x="346" y="670" width="90" height="8" rx="4" fill="#a9b7c8"/>
  <!-- tab bar -->
  <path d="M252 742h308v52a40 40 0 0 1-40 40H292a40 40 0 0 1-40-40z" fill="#f4f6f9"/>
  <circle cx="310" cy="782" r="9" fill="#c2410c"/><circle cx="374" cy="782" r="9" fill="#a9b7c8"/>
  <circle cx="438" cy="782" r="9" fill="#a9b7c8"/><circle cx="502" cy="782" r="9" fill="#a9b7c8"/>

  <!-- Phone B: detail -->
  <g filter="url(#sh)"><rect x="624" y="110" width="340" height="700" rx="52" fill="#0b1b2e"/></g>
  <rect x="640" y="126" width="308" height="668" rx="40" fill="#fff"/>
  <path d="M680 126h228a40 40 0 0 1 40 40v234H640V166a40 40 0 0 1 40-40z" fill="url(#photo)"/>
  <rect x="750" y="140" width="88" height="22" rx="11" fill="#0b1b2e"/>
  <circle cx="680" cy="196" r="20" fill="#fff"/>
  <path d="M684 188l-8 8 8 8" stroke="#0b1b2e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="908" cy="196" r="20" fill="#fff"/>
  <path d="M908 206s-11-6-11-13a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 7-11 13-11 13z" fill="#c2410c"/>
  <circle cx="794" cy="300" r="62" fill="#c2410c"/>
  <rect x="770" y="276" width="48" height="48" rx="12" fill="#fff" opacity=".9"/>
  <!-- content -->
  <rect x="668" y="428" width="190" height="20" rx="8" fill="#0b1b2e"/>
  <rect x="668" y="462" width="120" height="10" rx="5" fill="#a9b7c8"/>
  <g fill="#dbe1e8">
    <rect x="668" y="498" width="252" height="10" rx="5"/><rect x="668" y="518" width="236" height="10" rx="5"/><rect x="668" y="538" width="180" height="10" rx="5"/>
  </g>
  <rect x="668" y="574" width="76" height="30" rx="15" fill="#fdf1ea"/><rect x="686" y="585" width="40" height="8" rx="4" fill="#c2410c"/>
  <rect x="754" y="574" width="76" height="30" rx="15" fill="#f4f6f9"/><rect x="772" y="585" width="40" height="8" rx="4" fill="#a9b7c8"/>
  <rect x="668" y="628" width="252" height="66" rx="16" fill="#f4f6f9"/>
  <rect x="684" y="644" width="34" height="34" rx="17" fill="#fff"/><rect x="730" y="650" width="100" height="10" rx="5" fill="#445063"/><rect x="730" y="666" width="70" height="8" rx="4" fill="#a9b7c8"/>
  <rect x="668" y="716" width="252" height="54" rx="16" fill="#c2410c"/>
  <rect x="744" y="738" width="100" height="10" rx="5" fill="#fff"/>
</svg>
