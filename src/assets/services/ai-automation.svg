<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" fill="none">
  <!-- AI & Automation: assistant chat panel beside a trigger → AI → action workflow. Colours = site tokens. -->
  <defs>
    <filter id="sh" x="-10%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1b2e" flood-opacity=".1"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0b1b2e" flood-opacity=".08"/>
    </filter>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#c2410c" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="1000" fill="#f4f6f9"/>
  <circle cx="1060" cy="160" r="220" fill="#fdf1ea"/>
  <circle cx="120" cy="900" r="170" fill="#fdf1ea" opacity=".7"/>

  <!-- Chat panel -->
  <g filter="url(#sh)"><rect x="90" y="130" width="500" height="740" rx="16" fill="#fff"/></g>
  <path d="M106 130h468a16 16 0 0 1 16 16v66H90v-66a16 16 0 0 1 16-16z" fill="#0b1b2e"/>
  <circle cx="140" cy="171" r="22" fill="#c2410c"/>
  <path d="M140 157c2 9 5 12 14 14-9 2-12 5-14 14-2-9-5-12-14-14 9-2 12-5 14-14z" fill="#fff"/>
  <text x="176" y="179" font-family="Plus Jakarta Sans, Inter, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#fff">Assistant</text>
  <circle cx="548" cy="171" r="6" fill="#fb923c"/>

  <!-- Messages -->
  <rect x="122" y="246" width="300" height="86" rx="18" fill="#f4f6f9"/>
  <rect x="146" y="268" width="230" height="12" rx="6" fill="#a9b7c8"/>
  <rect x="146" y="294" width="170" height="12" rx="6" fill="#a9b7c8"/>

  <path d="M286 360h254a18 18 0 0 1 18 18v40a18 18 0 0 1-18 18H286a18 18 0 0 1-18-18v-40a18 18 0 0 1 18-18z" fill="#c2410c"/>
  <rect x="292" y="384" width="220" height="12" rx="6" fill="#fff" opacity=".9"/>
  <rect x="292" y="408" width="140" height="10" rx="5" fill="#fff" opacity=".7"/>

  <rect x="122" y="464" width="340" height="150" rx="18" fill="#f4f6f9"/>
  <rect x="146" y="488" width="260" height="12" rx="6" fill="#a9b7c8"/>
  <rect x="146" y="514" width="210" height="12" rx="6" fill="#a9b7c8"/>
  <rect x="146" y="546" width="292" height="46" rx="10" fill="#fff"/>
  <rect x="162" y="562" width="14" height="14" rx="3" fill="#fb923c"/>
  <rect x="188" y="564" width="160" height="10" rx="5" fill="#dbe1e8"/>

  <rect x="122" y="642" width="96" height="44" rx="18" fill="#f4f6f9"/>
  <circle cx="148" cy="664" r="6" fill="#a9b7c8"/><circle cx="170" cy="664" r="6" fill="#a9b7c8"/><circle cx="192" cy="664" r="6" fill="#dbe1e8"/>

  <!-- Input -->
  <rect x="122.5" y="786.5" width="436" height="55" rx="27.5" fill="#fff" stroke="#dbe1e8"/>
  <rect x="148" y="809" width="190" height="10" rx="5" fill="#dbe1e8"/>
  <circle cx="530" cy="814" r="20" fill="#c2410c"/>
  <path d="M522 814h14m-6-7l7 7-7 7" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Workflow -->
  <path d="M870 316v118M870 566v118" stroke="#dbe1e8" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="870" cy="376" r="14" fill="#fff" stroke="#dbe1e8" stroke-width="3"/>
  <path d="M864 373l6 6 6-6" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="870" cy="626" r="14" fill="#fff" stroke="#dbe1e8" stroke-width="3"/>
  <path d="M864 623l6 6 6-6" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trigger -->
  <g filter="url(#sh)"><rect x="680" y="186" width="380" height="130" rx="16" fill="#fff"/></g>
  <rect x="708" y="216" width="70" height="70" rx="16" fill="#fdf1ea"/>
  <path d="M748 228l-20 32h16l-6 20 22-32h-16z" fill="#c2410c"/>
  <rect x="800" y="230" width="150" height="14" rx="7" fill="#0b1b2e"/>
  <rect x="800" y="258" width="200" height="10" rx="5" fill="#dbe1e8"/>

  <!-- AI step -->
  <g filter="url(#glow)"><rect x="680" y="436" width="380" height="130" rx="16" fill="#0b1b2e"/></g>
  <rect x="708" y="466" width="70" height="70" rx="16" fill="#c2410c"/>
  <path d="M743 476c3 15 8 21 23 25-15 4-20 9-23 24-3-15-8-20-23-24 15-4 20-10 23-25z" fill="#fff"/>
  <rect x="800" y="480" width="120" height="14" rx="7" fill="#fff"/>
  <rect x="800" y="508" width="190" height="10" rx="5" fill="#26394f"/>
  <rect x="800" y="526" width="140" height="10" rx="5" fill="#26394f"/>

  <!-- Action -->
  <g filter="url(#sh)"><rect x="680" y="686" width="380" height="130" rx="16" fill="#fff"/></g>
  <rect x="708" y="716" width="70" height="70" rx="16" fill="#fdf1ea"/>
  <circle cx="743" cy="751" r="20" fill="#c2410c"/>
  <path d="M733 751l7 7 13-14" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="800" y="730" width="140" height="14" rx="7" fill="#0b1b2e"/>
  <rect x="800" y="758" width="180" height="10" rx="5" fill="#dbe1e8"/>
</svg>
