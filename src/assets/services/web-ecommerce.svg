<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" fill="none">
  <!-- Web & E-commerce: browser with a product grid, one product card highlighted, cart badge. Colours = site tokens. -->
  <defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1b2e" flood-opacity=".1"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0b1b2e" flood-opacity=".08"/>
    </filter>
    <filter id="lift" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#9a3412" flood-opacity=".22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1b2e" flood-opacity=".08"/>
    </filter>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf1ea"/><stop offset="1" stop-color="#fb923c" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1000" fill="#f4f6f9"/>
  <circle cx="140" cy="140" r="200" fill="#fdf1ea"/>
  <circle cx="1100" cy="900" r="180" fill="#fdf1ea" opacity=".7"/>

  <!-- Browser -->
  <g filter="url(#sh)"><rect x="100" y="110" width="1000" height="780" rx="16" fill="#fff"/></g>
  <path d="M116 110h968a16 16 0 0 1 16 16v42H100v-42a16 16 0 0 1 16-16z" fill="#f4f6f9"/>
  <circle cx="134" cy="139" r="7" fill="#dbe1e8"/><circle cx="158" cy="139" r="7" fill="#dbe1e8"/><circle cx="182" cy="139" r="7" fill="#dbe1e8"/>
  <rect x="380" y="124" width="440" height="30" rx="15" fill="#fff"/>
  <rect x="404" y="135" width="160" height="8" rx="4" fill="#dbe1e8"/>
  <path d="M100 168h1000" stroke="#dbe1e8"/>

  <!-- Store nav -->
  <rect x="140" y="198" width="34" height="34" rx="10" fill="#c2410c"/>
  <rect x="186" y="208" width="96" height="14" rx="7" fill="#0b1b2e"/>
  <g fill="#a9b7c8"><rect x="420" y="210" width="64" height="10" rx="5"/><rect x="508" y="210" width="72" height="10" rx="5"/><rect x="604" y="210" width="58" height="10" rx="5"/></g>
  <rect x="860" y="196" width="140" height="38" rx="19" fill="#f4f6f9"/>
  <rect x="884" y="211" width="80" height="8" rx="4" fill="#dbe1e8"/>
  <!-- Cart with badge -->
  <path d="M1022 204h8l8 22h24l6-16h-34" stroke="#0b1b2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1042" cy="234" r="3.5" fill="#0b1b2e"/><circle cx="1060" cy="234" r="3.5" fill="#0b1b2e"/>
  <circle cx="1068" cy="198" r="11" fill="#c2410c"/><circle cx="1068" cy="198" r="4" fill="#fff"/>

  <!-- Category chips -->
  <rect x="140" y="262" width="76" height="30" rx="15" fill="#0b1b2e"/><rect x="158" y="273" width="40" height="8" rx="4" fill="#fff"/>
  <rect x="226" y="262" width="88" height="30" rx="15" fill="#f4f6f9"/><rect x="244" y="273" width="52" height="8" rx="4" fill="#a9b7c8"/>
  <rect x="324" y="262" width="80" height="30" rx="15" fill="#f4f6f9"/><rect x="342" y="273" width="44" height="8" rx="4" fill="#a9b7c8"/>

  <!-- Product grid (3 × 2) -->
  <g>
    <!-- row 1 -->
    <rect x="140.5" y="316.5" width="279" height="259" rx="13.5" fill="#fff" stroke="#dbe1e8"/>
    <rect x="152" y="328" width="256" height="150" rx="10" fill="#f4f6f9"/>
    <rect x="236" y="362" width="88" height="88" rx="22" fill="#dbe1e8"/>
    <rect x="152" y="494" width="140" height="12" rx="6" fill="#445063"/><rect x="152" y="518" width="90" height="10" rx="5" fill="#dbe1e8"/>
    <rect x="152" y="544" width="64" height="16" rx="6" fill="#0b1b2e"/>

    <rect x="780.5" y="316.5" width="279" height="259" rx="13.5" fill="#fff" stroke="#dbe1e8"/>
    <rect x="792" y="328" width="256" height="150" rx="10" fill="#fdf1ea"/>
    <circle cx="920" cy="403" r="46" fill="#fb923c" opacity=".55"/>
    <rect x="792" y="494" width="120" height="12" rx="6" fill="#445063"/><rect x="792" y="518" width="100" height="10" rx="5" fill="#dbe1e8"/>
    <rect x="792" y="544" width="58" height="16" rx="6" fill="#0b1b2e"/>

    <!-- row 2 -->
    <rect x="140.5" y="599.5" width="279" height="259" rx="13.5" fill="#fff" stroke="#dbe1e8"/>
    <rect x="152" y="611" width="256" height="150" rx="10" fill="#fdf1ea"/>
    <path d="M230 720l50-60 50 60z" fill="#fb923c" opacity=".55"/>
    <rect x="152" y="777" width="130" height="12" rx="6" fill="#445063"/><rect x="152" y="801" width="80" height="10" rx="5" fill="#dbe1e8"/>
    <rect x="152" y="827" width="60" height="16" rx="6" fill="#0b1b2e"/>

    <rect x="460.5" y="599.5" width="279" height="259" rx="13.5" fill="#fff" stroke="#dbe1e8"/>
    <rect x="472" y="611" width="256" height="150" rx="10" fill="#f4f6f9"/>
    <circle cx="600" cy="686" r="44" fill="#dbe1e8"/>
    <rect x="472" y="777" width="150" height="12" rx="6" fill="#445063"/><rect x="472" y="801" width="96" height="10" rx="5" fill="#dbe1e8"/>
    <rect x="472" y="827" width="70" height="16" rx="6" fill="#0b1b2e"/>

    <rect x="780.5" y="599.5" width="279" height="259" rx="13.5" fill="#fff" stroke="#dbe1e8"/>
    <rect x="792" y="611" width="256" height="150" rx="10" fill="#f4f6f9"/>
    <rect x="876" y="644" width="88" height="88" rx="44" fill="#dbe1e8"/>
    <rect x="792" y="777" width="110" height="12" rx="6" fill="#445063"/><rect x="792" y="801" width="88" height="10" rx="5" fill="#dbe1e8"/>
    <rect x="792" y="827" width="66" height="16" rx="6" fill="#0b1b2e"/>
  </g>

  <!-- Highlighted product card (lifted) -->
  <g filter="url(#lift)">
    <rect x="448" y="298" width="304" height="296" rx="16" fill="#fff"/>
  </g>
  <rect x="449.5" y="299.5" width="301" height="293" rx="14.5" stroke="#c2410c" stroke-width="3"/>
  <rect x="464" y="314" width="272" height="160" rx="12" fill="url(#hero)"/>
  <rect x="548" y="344" width="104" height="104" rx="26" fill="#c2410c"/>
  <rect x="572" y="372" width="56" height="48" rx="10" fill="#fff" opacity=".9"/>
  <rect x="480" y="328" width="58" height="22" rx="11" fill="#fff"/><rect x="490" y="335" width="38" height="8" rx="4" fill="#c2410c"/>
  <rect x="464" y="490" width="160" height="14" rx="7" fill="#0b1b2e"/>
  <rect x="464" y="514" width="110" height="10" rx="5" fill="#dbe1e8"/>
  <rect x="464" y="542" width="272" height="38" rx="10" fill="#c2410c"/>
  <rect x="560" y="557" width="80" height="8" rx="4" fill="#fff"/>
</svg>
