<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" fill="none">
  <!-- Brand & Digital Marketing: brand board — logo mark, colour swatches, type sample, social post, buttons. Colours = site tokens. -->
  <defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1b2e" flood-opacity=".1"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0b1b2e" flood-opacity=".08"/>
    </filter>
    <filter id="sh2" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1b2e" flood-opacity=".1"/>
    </filter>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1000" fill="#f4f6f9"/>
  <circle cx="1090" cy="130" r="200" fill="#fdf1ea"/>
  <circle cx="110" cy="910" r="170" fill="#fdf1ea" opacity=".7"/>

  <!-- Board -->
  <g filter="url(#sh)"><rect x="100" y="110" width="1000" height="780" rx="16" fill="#fff"/></g>

  <!-- Logo tile -->
  <rect x="136" y="146" width="400" height="330" rx="14" fill="#0b1b2e"/>
  <circle cx="336" cy="311" r="118" fill="#12263d"/>
  <rect x="272" y="246" width="128" height="128" rx="34" fill="#c2410c"/>
  <circle cx="374" cy="272" r="22" fill="#fb923c"/>
  <path d="M300 344l36-56 36 56" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="166" y="436" width="90" height="10" rx="5" fill="#26394f"/>
  <rect x="440" y="432" width="66" height="18" rx="9" fill="#26394f"/>

  <!-- Colour swatches -->
  <rect x="572.5" y="146.5" width="491" height="155" rx="13.5" stroke="#dbe1e8"/>
  <g>
    <rect x="596" y="170" width="96" height="76" rx="12" fill="#0b1b2e"/>
    <rect x="712" y="170" width="96" height="76" rx="12" fill="#c2410c"/>
    <rect x="828" y="170" width="96" height="76" rx="12" fill="#fb923c"/>
    <rect x="944" y="170" width="96" height="76" rx="12" fill="#fdf1ea" stroke="#dbe1e8"/>
  </g>
  <g fill="#dbe1e8">
    <rect x="596" y="262" width="66" height="9" rx="4.5"/><rect x="712" y="262" width="66" height="9" rx="4.5"/>
    <rect x="828" y="262" width="66" height="9" rx="4.5"/><rect x="944" y="262" width="66" height="9" rx="4.5"/>
  </g>

  <!-- Type sample -->
  <rect x="572.5" y="321.5" width="491" height="155" rx="13.5" stroke="#dbe1e8"/>
  <text x="598" y="430" font-family="Plus Jakarta Sans, Inter, Segoe UI, sans-serif" font-size="104" font-weight="800" fill="#0b1b2e" letter-spacing="-3">Aa</text>
  <rect x="770" y="352" width="96" height="10" rx="5" fill="#c2410c"/>
  <rect x="770" y="378" width="250" height="16" rx="8" fill="#0b1b2e"/>
  <rect x="770" y="408" width="220" height="10" rx="5" fill="#dbe1e8"/>
  <rect x="770" y="428" width="180" height="10" rx="5" fill="#dbe1e8"/>

  <!-- Social post card -->
  <g filter="url(#sh2)"><rect x="136" y="512" width="400" height="342" rx="16" fill="#fff"/></g>
  <rect x="136.5" y="512.5" width="399" height="341" rx="15.5" stroke="#dbe1e8"/>
  <circle cx="176" cy="550" r="20" fill="#c2410c"/>
  <rect x="206" y="540" width="110" height="10" rx="5" fill="#445063"/><rect x="206" y="558" width="70" height="8" rx="4" fill="#a9b7c8"/>
  <circle cx="490" cy="550" r="4" fill="#a9b7c8"/><circle cx="504" cy="550" r="4" fill="#a9b7c8"/><circle cx="476" cy="550" r="4" fill="#a9b7c8"/>
  <rect x="156" y="584" width="360" height="186" rx="12" fill="url(#post)"/>
  <circle cx="460" cy="630" r="54" fill="#fff" opacity=".16"/>
  <rect x="182" y="706" width="170" height="16" rx="8" fill="#fff"/>
  <rect x="182" y="732" width="120" height="10" rx="5" fill="#fff" opacity=".75"/>
  <path d="M168 806s-12-7-12-15a7 7 0 0 1 12-4 7 7 0 0 1 12 4c0 8-12 15-12 15z" fill="#c2410c"/>
  <path d="M206 790h22a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6h-14l-8 6v-22a6 6 0 0 1 6-6z" stroke="#a9b7c8" stroke-width="3"/>
  <path d="M254 792l12 8-12 8z" stroke="#a9b7c8" stroke-width="3" stroke-linejoin="round"/>
  <rect x="436" y="794" width="80" height="10" rx="5" fill="#dbe1e8"/>

  <!-- Components: buttons, chips, card -->
  <rect x="572.5" y="512.5" width="491" height="341" rx="13.5" fill="#f4f6f9" stroke="#dbe1e8"/>
  <rect x="600" y="542" width="168" height="48" rx="12" fill="#c2410c"/><rect x="636" y="562" width="96" height="9" rx="4.5" fill="#fff"/>
  <rect x="784.5" y="542.5" width="167" height="47" rx="11.5" fill="#fff" stroke="#0b1b2e" stroke-opacity=".2"/><rect x="822" y="562" width="92" height="9" rx="4.5" fill="#0b1b2e"/>
  <rect x="600" y="612" width="84" height="30" rx="15" fill="#fdf1ea"/><rect x="618" y="623" width="48" height="8" rx="4" fill="#c2410c"/>
  <rect x="694" y="612" width="84" height="30" rx="15" fill="#0b1b2e"/><rect x="712" y="623" width="48" height="8" rx="4" fill="#fff"/>
  <rect x="788" y="612" width="84" height="30" rx="15" fill="#fff"/><rect x="806" y="623" width="48" height="8" rx="4" fill="#a9b7c8"/>
  <!-- business card -->
  <g transform="rotate(-6 820 750)" filter="url(#sh2)">
    <rect x="640" y="672" width="300" height="158" rx="14" fill="#0b1b2e"/>
  </g>
  <g transform="rotate(-6 820 750)">
    <rect x="664" y="696" width="40" height="40" rx="11" fill="#c2410c"/>
    <path d="M674 727l10-16 10 16" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="664" y="766" width="120" height="12" rx="6" fill="#fff"/>
    <rect x="664" y="788" width="86" height="8" rx="4" fill="#26394f"/>
    <rect x="860" y="696" width="56" height="8" rx="4" fill="#fb923c"/>
  </g>
</svg>
