<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-orange" cx="1" cy="0" r="0.75">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="0" cy="1" r="0.7">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .headline { font-family: 'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 68px; letter-spacing: -1.4px; fill: #FFFFFF; }
      .accent { fill: #FB923C; }
      .meta { font-family: 'Inter Variable', Inter, sans-serif; font-weight: 500; font-size: 26px; fill: #A9B7C8; }
      .url { font-family: 'Inter Variable', Inter, sans-serif; font-weight: 600; font-size: 26px; fill: #FB923C; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0B1B2E"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow-orange)"/>
  <rect width="1200" height="630" fill="url(#glow-indigo)"/>

  <!-- Logo: white mark + wordmark -->
  <image href="../../src/assets/brand/logo-mark-white.png" x="80" y="72" width="96" height="64"/>
  <image href="../../src/assets/brand/logo-wordmark-white.png" x="190" y="84" width="200" height="40"/>

  <!-- Headline -->
  <text class="headline" x="80" y="268">We build <tspan class="accent">smart software</tspan></text>
  <text class="headline" x="80" y="350"><tspan class="accent">and AI</tspan> that grows</text>
  <text class="headline" x="80" y="432">your business.</text>

  <!-- Footer line -->
  <text class="meta" x="80" y="528">POS systems · Custom software · Websites · Mobile apps · AI</text>
  <text class="url" x="80" y="574">muchlogic.com <tspan class="meta">· Built in Sri Lanka</tspan></text>
</svg>
